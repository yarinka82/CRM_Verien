version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: verien_db
      POSTGRES_USER: verien_user
      POSTGRES_PASSWORD: verien_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://verien_user:verien_password@db:5432/verien_db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data: